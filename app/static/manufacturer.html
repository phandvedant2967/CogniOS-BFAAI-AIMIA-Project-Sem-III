<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CogniOS · Manufacturer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235059c9'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/cognios.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5059c9"/><circle cx="16" cy="16" r="5" fill="#fff"/><circle cx="16" cy="7" r="2" fill="#fff" opacity=".7"/><circle cx="16" cy="25" r="2" fill="#fff" opacity=".7"/><circle cx="7" cy="16" r="2" fill="#fff" opacity=".7"/><circle cx="25" cy="16" r="2" fill="#fff" opacity=".7"/></svg>
      <div><div class="brand-name">CogniOS</div><div class="brand-sub">MANUFACTURER</div></div>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="/manufacturer" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Safety signals</span>
      </a>
    </nav>
    <p class="sidebar-foot small muted">Aggregated, de-identified data only. Signals are not confirmed adverse effects.</p>
  </aside>

  <main class="main">
    <header class="topbar"><h1>Safety signals</h1></header>

    <section class="card" aria-labelledby="flt-h">
      <h2 class="sr-only" id="flt-h">Filters</h2>
      <form id="filter-form" class="filter-bar">
        <div class="field"><label for="f-drug">Drug</label><select class="select" id="f-drug"><option value="">All drugs</option></select></div>
        <div class="field"><label for="f-effect">Effect</label><select class="select" id="f-effect"><option value="">All effects</option></select></div>
        <div class="field"><label for="f-from">From</label><input class="select" type="date" id="f-from"></div>
        <div class="field"><label for="f-to">To</label><input class="select" type="date" id="f-to"></div>
        <div class="field"><label for="f-model">Model</label><select class="select" id="f-model"><option value="">All models</option></select></div>
        <div class="field"><span class="label" id="int-label">Trend interval</span>
          <div class="segmented" role="group" aria-labelledby="int-label" id="f-interval"></div></div>
        <div class="filter-actions"><button class="btn" type="submit">Apply</button><button class="btn secondary" type="button" id="f-reset">Reset</button></div>
      </form>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="content"></div>
  </main>
</div>
<script src="/static/js/mfr.js"></script>
<script src="/static/js/mfr-app.js"></script>
</body>
</html>
