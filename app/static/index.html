<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CogniOS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235059c9'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/cognios.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5059c9"/><circle cx="16" cy="16" r="5" fill="#fff"/><circle cx="16" cy="7" r="2" fill="#fff" opacity=".7"/><circle cx="16" cy="25" r="2" fill="#fff" opacity=".7"/><circle cx="7" cy="16" r="2" fill="#fff" opacity=".7"/><circle cx="25" cy="16" r="2" fill="#fff" opacity=".7"/></svg>
      <div><div class="brand-name">CogniOS</div><div class="brand-sub">CLINICIAN</div></div>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="/" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
        <span>Patient review</span>
      </a>
    </nav>
    <p class="sidebar-foot small muted">Model output supports, and never replaces, clinical judgement.</p>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Patient review</h1>
      <form class="search" id="lookup-form" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <label class="sr-only" for="patient-id">Patient ID</label>
        <input id="patient-id" name="patient_id" placeholder="Enter patient ID, e.g. V4_2_P0001" spellcheck="false" maxlength="40">
        <button class="btn" type="submit" id="lookup-btn">Look up</button>
      </form>
    </header>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="workspace" hidden></div>
    <div id="landing" class="card">
      <h2>Look up a patient</h2>
      <p class="muted" style="margin-top:6px">Enter a patient ID to see recorded history, then request a model assessment for one of the patient's medications.</p>
    </div>
  </main>
</div>
<script src="/static/js/logic.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
